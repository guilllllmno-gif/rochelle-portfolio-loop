-family="Arial, sans-serif" font-size="14" font-weight="600">02</text><text x="918" y="516" fill="#2b1630" font-family="Arial, sans-serif" font-size="23" font-weight="600">Set a boundary</text><text x="918" y="550" fill="#2b1630" font-family="Arial, sans-serif" font-size="16" font-weight="400">Make spending controls explicit.</text><text x="872" y="635" fill="#2b1630" font-family="Arial, sans-serif" font-size="14" font-weight="600">03</text><text x="918" y="636" fill="#2b1630" font-family="Arial, sans-serif" font-size="23" font-weight="600">Keep the context</text><text x="918" y="670" fill="#2b1630" font-family="Arial, sans-serif" font-size="16" font-weight="400">Review activity with clear currency labels.</text><rect x="112" y="808" width="241" height="42" fill="#cde0b6" stroke="none" rx="21"/><text x="128" y="836" fill="#2b1630" font-family="Arial, sans-serif" font-size="16" font-weight="600">Explore the concept →</text></svg>